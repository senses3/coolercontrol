  Drawn on a 16 grid: the stem is 1.60px and the mark is inset so it sits
  with the other tray icons. Generated by scripts/gen-app-icons.py.
-->
<svg width="16" height="16" viewBox="0 0 16 16" version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style type="text/css">
        .ColorScheme-Text { color:#fcfcfc; }
    </style>
    <!-- Carves a transparent gap around the badge so it reads on any
         background: an outline in a fixed colour cannot, since the panel
         colour is unknown. Cut geometrically rather than with a mask:
         GTK's symbolic pipeline rewrites the fills inside a mask and takes
         the whole mark down to about 70% opacity. A renderer that ignores
         clip paths just draws the badge over the mark, which is still
         correct. -->
    <clipPath id="badge-cut" clipPathUnits="userSpaceOnUse">
      <path clip-rule="evenodd"
         d="M 0,0 H 16 V 16 H 0 Z M 8.774,12.128 A 3.354,3.354 0 1,0 15.482,12.128 A 3.354,3.354 0 1,0 8.774,12.128 Z" />
